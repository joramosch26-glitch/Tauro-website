<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f3ee;color:#20211f;font-family:Arial,sans-serif;">
    <main style="max-width:560px;margin:40px auto;padding:32px;background:#ffffff;">
      <p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9b6b36;">
        Tauro Paint Guide
      </p>
      <h1 style="margin:0 0 20px;font-size:28px;line-height:1.2;">Staff sign-in code</h1>
      <p style="font-size:16px;line-height:1.6;">Enter this six-digit code in the Paint Guide staff sign-in screen:</p>
      <p style="margin:28px 0;font-size:38px;font-weight:700;letter-spacing:.28em;line-height:1;text-align:center;">
        {{ .Token }}
      </p>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#5f625d;">This code expires according to the local Auth configuration. If you did not request it, you can ignore this email.</p>
    </main>
  </body>
</html>
